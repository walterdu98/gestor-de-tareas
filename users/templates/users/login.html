<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tiempos | Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a; 
            background-image: radial-gradient(circle at 0% 0%, #1e293b 0%, #0f172a 100%);
        }

        .django-form p {
            margin-bottom: 1.25rem;
        }
        
        .django-form label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b; 
            margin-bottom: 0.5rem;
            margin-left: 0.25rem;
        }

        .django-form input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #f1f5f9;
            border-radius: 1rem;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
            font-weight: 600;
            color: #1e293b;
        }

        .django-form input:focus {
            border-color: #6366f1;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
        }


        ul.errorlist {
            display: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="relative w-full max-w-md">
        {# TARJETA PRINCIPAL #}
        <div class="bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-slate-200">
            
            {# CABECERA SOBRIA #}
            <div class="bg-slate-50 p-8 text-center border-b border-slate-100">
                <div class="bg-indigo-600 w-12 h-12 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-indigo-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                    </svg>
                </div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">Iniciar Sesión</h1>
                <p class="text-slate-500 mt-1 text-sm font-medium uppercase tracking-tighter">Bienvenido</p>
            </div>

            {# CUERPO DEL LOGIN #}
            <div class="p-8 md:p-10">
                <form method="post" autocomplete="off">
                    {% csrf_token %}

                    <div class="django-form">
                        {{ form.as_p }}
                    </div>    
                    
                    {% if form.errors %}
                    <div class="bg-rose-50 border border-rose-100 text-rose-600 px-4 py-3 rounded-xl mb-6 text-xs font-bold flex items-center gap-2" role="alert">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                        <p>Usuario o contraseña incorrectos</p>
                    </div>
                    {% endif %}

                    <button type="submit" class="w-full bg-slate-800 text-white font-black py-4 rounded-xl hover:bg-slate-900 transition-all duration-300 shadow-xl shadow-slate-200 transform hover:-translate-y-1 active:scale-95 text-base mt-2">
                        Acceder al Sistema
                    </button>
                    
                </form>
            </div>
        </div>
        
        <p class="text-center text-slate-500 text-sm mt-8 font-medium">
            &copy; 2026 Gestor de Tiempos
        </p>
    </div>
</body>
</html>
